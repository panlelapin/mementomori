name: Android widget release

on:
  workflow_dispatch:

concurrency:
  group: android-widget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install local validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck ripgrep python3-yaml gnupg
      - name: Run strict Kotlin quality gate
        run: ./gradlew qualityCheck --no-daemon --stacktrace
      - name: Restore distribution signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          test -n "$RELEASE_KEYSTORE"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.p12"
      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: distribution
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify, collect, and checksum exactly one APK
        shell: bash
        run: |
          set -Eeuo pipefail
          export EXPECTED_CERT_SHA256="$(tr -d '\r\n' < config/release-certificate.sha256)"
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' -print)
          test "${#apks[@]}" -eq 1
          ./scripts/verify-apk "${apks[0]}" com.github.panlelapin.mementomori 34 36
          mkdir -p artifact
          cp -- "${apks[0]}" artifact/android-widget-arm64-v8a.apk
          (cd artifact && sha256sum android-widget-arm64-v8a.apk > android-widget-arm64-v8a.apk.sha256)
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-widget-arm64-v8a
          path: artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/release.p12"
